# ps2build port of the OPL (RiptOPL fork) build. Stress-test port: the classic
# Makefile build remains authoritative; this file builds everything the new
# $PS2DEV/packages SDK layout can build today. See _ps2build_compat/GAPS.md
# for every gap this file works around (missing packages, missing prebuilt
# IRXs, no codegen/asset steps -> _ps2build_compat/gen_assets.py, etc).
#
# Generated assets in _ps2build_compat/gen/ come from gen_assets.py (run it
# first). src/lang_internal.c + include/lang_autogen.h come from
# lang_compiler.py (see GAPS.md "codegen").

project: opl

targets:
  # ---------------------------------------------------------------------
  # Main EE binary. C translation units + generated embedded-asset arrays;
  # the 23 converted C++ TUs live in the oplxx ee_lib below so the strict
  # C++ flag set doesn't land on plain C compiles (ps2build applies cflags
  # to both ee_cc and ee_cxx edges of a target).
  # ---------------------------------------------------------------------
  - name: opl
    type: ee
    sources:
      - src/pad.c
      - src/fntsys.c
