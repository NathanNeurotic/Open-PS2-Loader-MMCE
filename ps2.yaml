# ps2build build definition for Open-PS2-Loader.
#
# Generated assets in tools/generated/ come from tools/gen_assets.py (run
# it first, and again after the first successful build so ee_core.elf/
# elfldr.elf are embedded for real). src/lang_internal.c and
# include/lang_autogen.h come from lang_compiler.py.

project: opl

targets:
  # ---------------------------------------------------------------------
  # Main EE binary. C translation units + generated embedded-asset arrays;
  # the 23 converted C++ TUs live in the oplxx ee_lib below so the strict
  # C++ flag set doesn't land on plain C compiles (ps2build applies cflags
  # to both ee_cc and ee_cxx edges of a target).
  # ---------------------------------------------------------------------
  - name: opl
    type: ee
    sources:
      - src/pad.c
      - src/fntsys.c
      - src/renderman.c
      - src/menusys.c
