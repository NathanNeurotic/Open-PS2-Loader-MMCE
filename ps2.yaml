  # Converted C++ translation units (strict GNU++17 freestanding set from
  # Makefile:315 EE_CXXFLAGS), archived and linked into opl.
  - name: oplxx
    type: ee_lib
    sources:
      - src/xparam.cpp
      - src/config.cpp
      - src/hdd.cpp
      - src/favsupport.cpp
      - src/ioman.cpp
      - src/supportbase.cpp
      - src/zso.cpp
      - src/lz4.cpp
      - src/appsupport.cpp
      - src/artindex.cpp
      - src/retrogem.cpp
      - src/folderbrowse.cpp
      - src/vmc_groups.cpp
      - src/atlas.cpp
      - src/nbns.cpp
      - src/httpclient.cpp
      - src/gsm.cpp
      - src/cheatman.cpp
      - src/ps2cnf.cpp
      - src/tar.cpp
      - src/ioprp.cpp
      - src/util.cpp
      - src/lang.cpp
    include_dirs:
      - .
      - include
      - modules/iopcore/common
      - modules/network/common
      - modules/hdd/common
      - modules/ds34bt/ee
      - modules/ds34usb/ee
    headers:
      - patches
      - iomanx
      - cglue
      - debug
      - kernel
      - cdvd
      - pad
      - mc
      - ps2ips
      - poweroff
      - gs
      - gskit
      - dmakit
      - draw
      - packet2
      - dma
      - graph
      - filexio
      - elf-loader-nocolour
    defines:
      - GSM_1080P
      - PADEMU
      - OPL_VERSION=\"v1.2.0-Beta-ps2build\"
    cflags:
      - -fsingle-precision-constant
      - -Wno-format-truncation
      - -Wno-stringop-truncation
      - -fdata-sections
      - -std=gnu++17
      - -fno-exceptions
      - -fno-rtti
      - -fno-threadsafe-statics
      - -fno-use-cxa-atexit

  # PADEMU EE-side libraries (Makefile: modules/ds34usb/ee, ds34bt/ee).
  # EE code: needs only kernel.h + sifrpc.h, both in the kernel package.
  # Do NOT add IOP package include dirs here — loadcore/include/sys/types.h
  # and sysclib/include/string.h shadow EE newlib headers on the compile
  # path of anything linking these libs (their includes propagate).
  - name: ds34usb_ee
    type: ee_lib
    sources:
      - modules/ds34usb/ee/libds34usb.c
    include_dirs:
      - modules/ds34usb/ee
    headers:
      - kernel

  - name: ds34bt_ee
    type: ee_lib
    sources:
      - modules/ds34bt/ee/libds34bt.c
    include_dirs:
      - modules/ds34bt/ee
    headers:
      - kernel

  # ee_core: the in-game EE core, embedded into opl as eecore_elf (bin2c of
  # build/bin/ee_core.elf by gen_assets.py — two-pass: build once, re-run
  # gen_assets.py to swap the stub for the real ELF, rebuild).
  - name: ee_core
    type: ee
    sources:
      - ee_core/src/main.c
      - ee_core/src/syshook.c
      - ee_core/src/iopmgr.c
      - ee_core/src/modmgr.c
      - ee_core/src/util.c
      - ee_core/src/patches.c
      - ee_core/src/padhook.c
      - ee_core/src/cd_igr_rpc.c
      - ee_core/src/tlb.c
      - ee_core/src/gsm_api.c
      - ee_core/src/cheat_api.c
      - ee_core/src/asm.S
      - ee_core/src/crt0.S
      - ee_core/src/patches_asm.S
      - ee_core/src/cheat_engine.S
      - ee_core/src/dve_reg.S
      - ee_core/src/gsm_engine.S
    include_dirs:
      - ee_core/include
      - ee_core
    headers:
      - cdvd
    defines:
      - GSM_1080P
      - PADEMU
    opt: -Os
    linkfile: ee_core/linkfile
    ldflags:
      - -nostartfiles
      - -nostdlib
      - -s
      - -Wl,-Map,ee_core.map
    libs:
      - patches

  # elfldr: no-IOP-reset child loader, embedded as elfldr_elf.
  - name: elfldr
    type: ee
    sources:
      - elfldr/loader.c
    defines:
      - NEWLIB_PORT_AWARE
    opt: -Os
    linkfile: elfldr/linkfile
    cflags:
      - -fdata-sections
    ldflags:
      - -Wl,-zmax-page-size=128
      - -s
    libs:
      - filexio








