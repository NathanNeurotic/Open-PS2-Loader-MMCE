name: build-flavours

# FOUR FLAVOURS, along two independent axes: WHICH toolchain, and PINNED vs ROLLING.
#
#                      pinned (reproducible)          rolling (early warning)
#   ps2dev             PS2DEVPINNED                   PS2DEVROLLING
#   official OPL CI    OFFICIALPINNED                 OFFICIALROLLING
#
# WHY THIS SPLIT EXISTS. Issue #382: one tester ran the same build in three flavours and got three
# different results -- official worked, ps2dev-latest started the game then black-screened, the
# pinned build failed outright. Identical source. There was then no way to tell whether that spread
# was our bug or the toolchain moving underneath us, because "latest" means something different every
# day: a report from last week was not comparable to a report from today, and neither could be
# reproduced on demand.
#
# The two columns answer two different questions and should be read that way:
#   PINNED  -- what testers should use. Reproducible, comparable across weeks, and the only builds a
#              bug report can meaningfully name. If a pinned build breaks, it is us.
#   ROLLING -- early warning. Tracks upstream so a toolchain regression surfaces here rather than in
#              a release. If a rolling build breaks while its pinned twin does not, it is upstream,
#              and that is a different bug with a different owner.
#
# ⚠ EVERY BUG REPORT MUST NAME ITS FLAVOUR. Each artifact carries BUILD-MANIFEST.txt recording the
# image, the resolved digest where known, the compiler version and the source commit -- so a report
# identifies exactly what ran. Without that this is four names and the same ambiguity as before.
#
# ⚠ THE PINS ARE A DELIBERATE, DATED DECISION, not a snapshot to refresh casually. Moving one
# invalidates comparability with every report gathered against it. Bump them on purpose, note the
# date, and expect to re-baseline.
#
# Each ELF also self-identifies via LOCALVERSION ("-<FLAVOUR>" suffix), so a stray ELF with no zip
# around it is still identifiable.

# push is restricted to the two INTEGRATION branches on purpose. Adding pull_request while leaving
# push on 'rebuild/**' made every PR build TWICE (once for the branch push, once for the PR event) --
# observed on PR #410. Feature branches are covered by their PR; these two are covered by the merge
# that lands on them.
on:
  push:
    branches:
      - master
      - rebuild/main
  pull_request:
  workflow_dispatch:

jobs:
  ra-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check disc hashing, reset image and launch gates
        run: python3 .github/scripts/test_ra_disc.py

  build-flavour:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- PINNED: reproducible. Give these to testers. ---
          # ps2dev, pinned 2026-08-13.
          - flavour: PS2DEVPINNED
            image: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "0"
          # Official OPL's own CI container, pinned 2026-08-13.
          - flavour: OFFICIALPINNED
            image: ghcr.io/ps2homebrew/ps2homebrew@sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
            digest: sha256:a1b1f87f09a88f64efbe11356aae47098d4d54b3b3a84f0609fa42369244e25d
            pinned: "yes (2026-08-13)"
            opldiag: "0"
          # --- ROLLING: early warning. Expect these to move without us changing anything. ---
          - flavour: PS2DEVROLLING
            image: ps2dev/ps2dev:latest
            digest: ""
            pinned: "no (tracks ps2dev/ps2dev:latest)"
            opldiag: "0"
          - flavour: OFFICIALROLLING
            image: ghcr.io/ps2homebrew/ps2homebrew:main
            digest: ""
            pinned: "no (tracks ps2homebrew:main)"
            opldiag: "0"
          # --- DIAGNOSTIC: same pinned toolchain as PS2DEVPINNED, built with OPLDIAG=1.
          # Adds the on-screen boot-stage labels and the error-code detail suffix. Those are raw
          # untranslated developer strings, which is exactly why they must never reach a build a
          # normal user runs -- and exactly why a tester needs a build that HAS them. This is the
          # ELF to hand out when the question is WHERE a console wedges.
          # It is NOT a DEBUG build: no TTY link, no -g. Everything else matches its pinned twin,
          # so a result gathered here is directly comparable with one gathered on PS2DEVPINNED.
          - flavour: PS2DEVPINNED-DIAG
            image: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "1"
          # RA is separately compiled; keep its disc core and modules covered on PRs.
          - flavour: PS2DEVPINNED-RA
            image: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            digest: sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
            pinned: "yes (2026-08-13)"
            opldiag: "0"
            ra: "1"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # git must exist BEFORE checkout (ps2dev images are minimal Alpine): without it,
      # actions/checkout falls back to an API tarball, git describe fails, and the version
      # string collapses to "-dirty". Guarded installs no-op where tools already exist
      # (the ps2homebrew image ships official OPL's full build deps).
      - name: Install host dependencies (either package manager)
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip unzip tar gzip xz python3 py3-pip py3-yaml gmp mpfr4 mpc1 gawk coreutils findutils grep sed diffutils || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip unzip python3 python3-yaml gawk || true
          fi

      - name: git checkout
        uses: actions/checkout@v4

      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true

      - name: Install menu-coherent mmceman (#254)
        run: sh .github/scripts/install_coherent_mmce.sh

      - name: Compile -> make clean release (${{ matrix.flavour }})
        run: make --trace clean && make --trace LOCALVERSION=${{ matrix.flavour }} OPLDIAG=${{ matrix.opldiag }} RETROACHIEVEMENTS=${{ matrix.ra || '0' }} release

      # Written AFTER the build so the compiler probe reflects what actually compiled. Every probe is
      # `|| true`: this file is a diagnostic and must never be the reason a good build fails to ship.
      # A rolling flavour has no digest to record here (the tag is resolved by the runner before this
      # step exists) -- the compiler version below is what identifies it, and it is the part that
      # actually matters when a toolchain change breaks something.
      - name: Record build manifest (${{ matrix.flavour }})
        if: ${{ always() }}
        run: |
          {
            echo "flavour:      ${{ matrix.flavour }}"
            echo "pinned:       ${{ matrix.pinned }}"
            echo "retroachievements: ${{ matrix.ra || '0' }}"
            echo "opldiag:      ${{ matrix.opldiag }}"
            echo "image:        ${{ matrix.image }}"
            echo "digest:       ${{ matrix.digest }}"
            echo "built (UTC):  $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "run:          ${{ github.run_id }}"
            echo "ref:          ${{ github.ref }}"
            echo "commit:       ${{ github.sha }}"
            echo "---- toolchain ----"
            (mips64r5900el-ps2-elf-gcc --version 2>/dev/null || ee-gcc --version 2>/dev/null || echo "ee compiler: not probed") | head -1
            (iop-gcc --version 2>/dev/null || mipsel-none-elf-gcc --version 2>/dev/null || echo "iop compiler: not probed") | head -1
            echo "PS2SDK=${PS2SDK:-unset}"
            for v in "$PS2SDK/../.version" "$PS2SDK/.version" /usr/local/ps2dev/.version; do
              [ -f "$v" ] && { echo "sdk version file ($v):"; cat "$v"; break; }
            done
          } > BUILD-MANIFEST.txt 2>/dev/null || true
          cat BUILD-MANIFEST.txt || true

      - name: Upload ELF (${{ matrix.flavour }})
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: OPL-${{ matrix.flavour }}
          path: |
            RIPTOPL-*.ELF
            OPNPS2LD-*.ELF
            BUILD-MANIFEST.txt
          if-no-files-found: error
