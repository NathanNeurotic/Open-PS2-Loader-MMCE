name: Apply staged VCD PR patch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/vcd-mmce-stability-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply staged source patch
        run: |
          set -eu
          if [ ! -f .github/tmp/vcd_fix.patch ]; then
            echo 'No staged VCD patch remains; nothing to do.'
            exit 0
          fi
          git apply --check --3way .github/tmp/vcd_fix.patch
          git apply --3way .github/tmp/vcd_fix.patch
          rm -f .github/tmp/vcd_fix.patch

      - name: Commit applied VCD fix
        run: |
          set -eu
          if git diff --quiet -- src/mmcesupport.c src/bdmsupport.c src/vcdsupport.c; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mmcesupport.c src/bdmsupport.c src/vcdsupport.c
          git add -u .github/tmp/vcd_fix.patch
          git commit -m 'fix(vcd): restore MMCE scans and launch preparation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
