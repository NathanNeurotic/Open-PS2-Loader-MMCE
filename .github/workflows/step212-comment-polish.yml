name: Step 212 recovery comment polish

on:
  push:
    branches:
      - rebuild/step-212-apa-boot-and-bgm-resilience

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/step-212-apa-boot-and-bgm-resilience
          fetch-depth: 0
      - name: Fix comment and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/opl.c')
          s = p.read_text()
          old = '''    // Recovery is discovery only. Never let the probed MC/USB path silently become the\n    // next save destination. Local boots return to their real boot home; bare boots return\n    // to the normal mc?:OPL home. A deferred network boot cannot save back to its unreadable\n    // share during bootstrap, so select a concrete reachable MC home when possible.\n'''
          new = '''    // Recovery is discovery only and never writes by itself. Known local boots return to their\n    // real boot home; a bare launch has no independent owner, so the existing config home that was\n    // actually recovered becomes the next explicit-save home. A deferred network boot cannot save\n    // back to its unreadable share during bootstrap, so select a concrete reachable MC home when possible.\n'''
          if old not in s:
              raise SystemExit('stale recovery ownership comment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git add src/opl.c
          git commit -m "rebuild-212: document bare recovery ownership"
          git rm .github/workflows/step212-comment-polish.yml
          git commit -m "chore: remove Step 212 comment helper"
          git push origin HEAD:rebuild/step-212-apa-boot-and-bgm-resilience
