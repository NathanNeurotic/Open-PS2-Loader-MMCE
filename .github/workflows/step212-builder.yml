name: Step 212 one-shot builder

on:
  push:
    branches:
      - automation/step-212-builder
    paths:
      - .github/workflows/step212-builder.yml

permissions:
  contents: write

jobs:
  step212:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/step212-coverflow.sh
        # One-shot hardware-feedback pass: deterministic APA config ownership, review fixes,
        # and tightly gated ETH/HDD follow-ups. Production branch is guarded by exact head SHA.
