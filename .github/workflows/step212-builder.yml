name: Step 212 one-shot builder

on:
  push:
    branches:
      - automation/step-212-builder
    paths:
      - .github/workflows/step212-builder.yml

permissions:
  contents: write

jobs:
  step212:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize staged handoff EOF
        run: |
          sed -i 's/text\.rstrip() + note + "\\n"/text.rstrip() + note.rstrip() + "\\n"/' .github/scripts/step212-coverflow.sh
      - run: bash .github/scripts/step212-coverflow.sh
        # Patch script validates exact production head before writing.
        # Consolidated hardware follow-up: APA lists, MC1, List art, APP metadata, BGM, VCD ID.
