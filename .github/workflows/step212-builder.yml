name: Step 212 one-shot builder

on:
  push:
    branches:
      - automation/step-212-builder
    paths:
      - .github/workflows/step212-builder.yml

permissions:
  contents: write

jobs:
  format-step-212:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact clang-format correction
        run: |
          git config user.name "NathanNeurotic Step Builder"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin rebuild/step-212-apa-boot-and-bgm-resilience
          git checkout rebuild/step-212-apa-boot-and-bgm-resilience
          test "$(git rev-parse HEAD)" = "a7c780a3fa574d1657084dbb1f8a1d436425800c"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/sound.c')
          text = p.read_text()
          old = '#define BGM_THREAD_BASE_PRIO 0x1E'
          new = '#define BGM_THREAD_BASE_PRIO  0x1E'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one BGM priority format line')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git add src/sound.c
          git commit -m "rebuild-212: satisfy clang-format for BGM priority define" -m "Formatting-only follow-up from CI-format-check: align BGM_THREAD_BASE_PRIO with the surrounding macro definitions. No runtime behavior changes."
          git push origin HEAD:rebuild/step-212-apa-boot-and-bgm-resilience
