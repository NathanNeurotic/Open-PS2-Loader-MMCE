name: Step 212 one-shot builder

on:
  push:
    branches:
      - automation/step-212-builder
    paths:
      - .github/scripts/step212_builder.py
      - .github/workflows/step212-builder.yml

permissions:
  contents: write

jobs:
  build-step-212:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply three production commits to Step 212
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/step212_builder.py')
          text = p.read_text()
          old = 'handoff.write_text(text.rstrip() + append + "\\n")'
          new = 'handoff.write_text(text.rstrip() + append.rstrip() + "\\n")'
          if text.count(old) != 1:
              raise SystemExit('expected one HANDOFF write expression')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/step212_builder.py
