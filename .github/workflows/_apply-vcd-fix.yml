name: Apply VCD fix staging

on:
  push:
    branches:
      - fix/vcd-mmce-stability-20260819

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vcd-mmce-stability-20260819
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply staged patch
        run: |
          set -eu
          test -f .github/tmp/vcd_fix.patch
          git apply --check --3way .github/tmp/vcd_fix.patch
          git apply --3way .github/tmp/vcd_fix.patch
          rm -f .github/tmp/vcd_fix.patch .github/tmp/trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mmcesupport.c src/bdmsupport.c
          git add -u .github/tmp/vcd_fix.patch .github/tmp/trigger.txt
          git commit -m 'fix(vcd): restore MMCE scans and protect the MX4SIO handoff'
          git push origin HEAD:fix/vcd-mmce-stability-20260819
