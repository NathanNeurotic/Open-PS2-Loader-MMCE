name: Apply fresh VCD fix

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/vcd-mmce-handoff-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply narrow source patch
        run: |
          sed -i '/^\*\*\* End Patch$/d' .github/tmp/vcd_fix.patch
          git apply --check --3way .github/tmp/vcd_fix.patch
          git apply --3way .github/tmp/vcd_fix.patch
          rm -f .github/tmp/vcd_fix.patch .github/workflows/_apply-vcd-fix.yml

      - name: Commit source changes and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mmcesupport.c src/bdmsupport.c src/vcdsupport.c
          git add -u .github/tmp/vcd_fix.patch .github/workflows/_apply-vcd-fix.yml
          git commit -m "fix(vcd): restore MMCE scans, safe BDMA reuse, and launch feedback"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
