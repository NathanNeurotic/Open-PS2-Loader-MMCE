name: CI-format-check

on:
  push:
    paths:
      - '**.h'
      - '**.c'
      - '.github/workflows/check-format.yml'
      - '.clang-format'
  pull_request:
    paths:
      - '**.h'
      - '**.c'
      - '.github/workflows/check-format.yml'
      - '.clang-format'

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: DoozyX/clang-format-lint-action@v0.18.2
        with:
          source: '.'
          extensions: 'h,c'
          clangFormatVersion: 12
          inplace: False
          # Vendored third-party sources are excluded. libsmb2 is imported VERBATIM so it can be
          # re-synced from upstream; reformatting it to this project's style would turn every future
          # update into a conflict, and its 52 files would otherwise fail this check outright.
          # Only the vendored subtree is excluded -- our own code in that module directory
          # (smb2man.c, posix.c, iopheap.c, udivdi3.c, the shims) is still checked.
          # modules/sio2man is ps2sdk source kept in upstream style so the local patch stays a
          # small reviewable diff against ps2dev/ps2sdk (see its PROVENANCE.md).
          exclude: './modules/network/smb2man/libsmb2 ./modules/sio2man'
