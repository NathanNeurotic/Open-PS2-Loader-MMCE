name: step211-apply-coderabbit-fixes

on:
  push:
    branches:
      - rebuild/step-211-consolidated-apa-config-safety

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/step-211-consolidated-apa-config-safety
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/step211_coderabbit_fix.py
      - name: Verify
        run: git diff --check
      - name: Commit final tree
        run: |
          rm -f .github/workflows/step211-apply.yml
          rm -f .github/workflows/step211-coderabbit-fixes.yml
          rm -f .github/step211_coderabbit_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "rebuild-211: address CodeRabbit HDD fallback edge cases"
          git push origin HEAD:rebuild/step-211-consolidated-apa-config-safety
