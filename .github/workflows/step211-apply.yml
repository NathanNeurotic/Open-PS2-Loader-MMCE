name: step211-apply-consolidated-apa-safety

on:
  push:
    branches:
      - rebuild/step-211-consolidated-apa-config-safety

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/step-211-consolidated-apa-config-safety
          fetch-depth: 0

      - name: Finalize consolidated policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/opl.c')
          s = p.read_text()

          replacements = [
              (
                  "static void resolveBootDirToMass(void)\n{\n    gBootHomeApa = 0;\n",
                  "static void resolveBootDirToMass(void)\n{\n    gBootHomeApa = 0;\n    gBootHddCommonFallback = 0;\n",
              ),
              (
                  "    // Custom Settings Path is an explicit destination. Resolve it before the write and fail\n    // visibly if it cannot be reached; never silently save to the normal home instead.\n",
                  "    // Custom Settings Path is an explicit destination. Non-HDD targets still fail visibly\n    // when unreachable. HDD/APA targets are different: they have a guaranteed safe ownership\n    // chain (conf_hdd.cfg target -> __common/OPL), so an invalid HDD target falls back there\n    // explicitly and the success dialog tells the user which HDD home was actually used.\n",
              ),
              (
                  "                configSetMove(customSettingsTarget);\n                gHddSettingsFallbackNotice = 1;\n                gLastSaveErrno = 0;\n",
                  "                configSetMove(customSettingsTarget);\n                snprintf(gLastSaveTarget, sizeof(gLastSaveTarget), \"%s\", customSettingsTarget);\n                gHddSettingsFallbackNotice = 1;\n                gLastSaveErrno = 0;\n",
              ),
              (
                  "            if (gHddSettingsFallbackNotice || gBootHddCommonFallback)\n                snprintf(notification, sizeof(notification), _l(_STR_SETTINGS_HDD_FALLBACK), path);\n            else\n                snprintf(notification, sizeof(notification), _l(_STR_SETTINGS_SAVED), path);\n",
                  "            if (gHddSettingsFallbackNotice || gBootHddCommonFallback) {\n                const char *displayHome = path;\n                if (!strcmp(gOPLPart, \"hdd0:__common\"))\n                    displayHome = \"hdd0:__common/OPL\";\n                else if (gOPLPart[0] != '\\0')\n                    displayHome = gOPLPart;\n                snprintf(notification, sizeof(notification), _l(_STR_SETTINGS_HDD_FALLBACK), displayHome);\n            } else {\n                snprintf(notification, sizeof(notification), _l(_STR_SETTINGS_SAVED), path);\n            }\n",
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'src/opl.c: expected exactly one match, found {count}: {old.splitlines()[0]}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          handoff = Path('HANDOFF.md')
          s = handoff.read_text()
          old = 'tip. **Next number: 211. Current tip: `rebuild/step-210-common-config-fallback-no-apa-create`.**'
          new = 'tip. **Next number: 212. Current tip: `rebuild/step-211-consolidated-apa-config-safety`.**'
          if s.count(old) != 1:
              raise SystemExit('HANDOFF.md: Step 210 pointer not found exactly once')
          s = s.replace(old, new, 1)
          if '## Step 211 — consolidated APA config safety finalization' not in s:
              s += "\n\n---\n\n## Step 211 — consolidated APA config safety finalization\n\nFinal audit polish for the Step-208 through Step-210 HDD config safety stack. Boot-derived fallback\nnotification state is reset if resolution reruns, failed writes after a graceful HDD custom-path\nfallback report the actual fallback target, and the success notification names the real APA home\n(`hdd0:__common/OPL` or the existing partition selected by `conf_hdd.cfg`) rather than the temporary\n`pfs0:` mount alias. No partition-creation behavior is reintroduced.\n"
          handoff.write_text(s)
          PY

      - name: Verify final shape
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -R "hddCreateOPLPartition" -n src include
          ! grep -n 'hddPartitionMountable("hdd0:+OPL")' src/hddsupport.c
          grep -n 'hdd0:__common/OPL' src/opl.c
          grep -n 'blocked dangerous raw APA write path' src/config.c
          grep -n 'SETTINGS_HDD_FALLBACK' src/opl.c lng_tmpl/_base.yml
          git diff --check

      - name: Commit final production tree and remove helper
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/step211-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/opl.c src/hddsupport.c src/config.c lng_tmpl/_base.yml HANDOFF.md .github/workflows/step211-apply.yml
          git diff --cached --check
          git commit -m "rebuild-211: consolidate safe HDD config fallback policy"
          git push origin HEAD:rebuild/step-211-consolidated-apa-config-safety
