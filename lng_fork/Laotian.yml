  "HINT_VCD_HIDE_GAMEID": "ເປັນຄวามงามເທົ່ານັ້ນ -- ເຊື່ອງຄຳນຳໜ້າ game-ID (ຕົວຢ່າງ SLUS_005.51.) ອອກຈາກຊື່ໃນລາຍການ PS1/VCD. ຊື່ທີ່ບໍ່ມີ ID ຈະຖືກສະແດງຕາມເດີມ. ບໍ່ປ່ຽນແປງການເປີດຕົວ, ຮູບໜ້າປົກ, ຫຼື ລາຍການທີ່ມັກ."
