  HINT_EMBER_DISPLAY: Mode keluaran yang dipakai Ember untuk gim PS1. 240p atau 480p ditulis ke settings.txt di folder EMBER pada perangkat yang diluncurkan. Bawaan menghapus pengaturan itu lagi, berikut berkasnya jika tidak berisi apa pun selain itu.
