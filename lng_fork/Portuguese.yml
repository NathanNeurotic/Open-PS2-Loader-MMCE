  EMBER_NO_DISC: Não há nenhuma imagem de disco de PS1 nesta pasta de jogo do Ember.
  VIEW_APPS: A mostrar aplicações
  EMBER_DISPLAY: Modo de imagem do Ember
  HINT_EMBER_DISPLAY: Modo de saída que o Ember usa para os jogos de PS1. 240p ou 480p é escrito no settings.txt da pasta EMBER do dispositivo iniciado. Predefinido remove essa definição, e também o ficheiro se não tiver mais nada.
