  GENERAL_SYSTEM: Pangkalahatan at sistema
  EMBER_NOT_FOUND: Nawawala ang ember.elf
  EMBER_BIOS_MISSING: Nawawala ang bios.bin sa tabi ng ember.elf
  EMBER_BAD_NAME: Hindi magagamit ng Ember ang pangalang ito ng folder (walang slash, colon o backslash, at walang tuldok sa simula).
  EMBER_NO_DISC: Walang PS1 disc image sa folder ng larong Ember na ito.
  VIEW_APPS: Ipinapakita ang mga app
  EMBER_DISPLAY: Display mode ng Ember
  HINT_EMBER_DISPLAY: Ang output mode na ginagamit ng Ember para sa mga larong PS1. Isinusulat ang 240p o 480p sa settings.txt sa loob ng EMBER folder ng device na inilunsad. Ang Default ay inaalis muli ang setting na iyon, pati na ang file kung wala nang ibang laman.
