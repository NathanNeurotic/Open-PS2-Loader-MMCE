  HINT_EMBER_DISPLAY: Modo de saída que o Ember usa para jogos de PS1. 240p ou 480p é gravado no settings.txt da pasta EMBER do dispositivo iniciado. Padrão remove essa configuração, e também o arquivo se ele não tiver mais nada.
